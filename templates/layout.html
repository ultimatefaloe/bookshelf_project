<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Home{% endblock %} | Bookshelf Library</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-800">

  {% include "nav.html" %}

  <!-- Flash messages -->
  {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
      {% for message in messages %}
        <div class="rounded-md px-4 py-3 text-sm
          {% if message.tags == 'success' %} bg-green-100 text-green-800 border border-green-200
          {% elif message.tags == 'error' %} bg-red-100 text-red-800 border border-red-200
          {% else %} bg-blue-100 text-blue-800 border border-blue-200 {% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  {% include "footer.html" %}

<script>
  window.URLS = {
    deleteBook: "{% url 'shelf:delete_book' 0 %}"
  };
</script>
<script src="{% static 'js/script.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>

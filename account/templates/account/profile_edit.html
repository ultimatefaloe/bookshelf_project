{% extends "layout.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

  <a href="{% url 'account:profile' %}"
     class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-900 mb-4">
    ← Back to profile
  </a>

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Update profile</h1>
    <p class="text-sm text-gray-500">Change your details and save.</p>
  </div>

  <div class="bg-white shadow rounded-lg p-6">
    {% include "components/profile_form.html" with form=form %}
  </div>
</div>
{% endblock %}

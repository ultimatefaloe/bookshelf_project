{% extends "layout.html" %}
{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md text-center">
    <div class="text-5xl mb-4">✅</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Password changed</h1>
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 sm:p-8">
      <p class="text-sm text-gray-600 mb-6">
        Your password has been updated. You'll stay logged in on this device.
      </p>
      <a href="{% url 'account:profile' %}"
         class="inline-flex items-center rounded-lg bg-indigo-600 text-white px-5 py-2.5 text-sm font-semibold hover:bg-indigo-700 transition">
        Back to profile
      </a>
    </div>
  </div>
</div>
{% endblock %}

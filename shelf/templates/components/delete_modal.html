<!-- Backdrop -->
<div id="delete-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"
       onclick="closeDeleteModal()"></div>

  <!-- Dialog -->
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6 animate-[fadeIn_.15s_ease-out]">
    <div class="flex items-start gap-4">
      <div class="h-12 w-12 shrink-0 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-2xl">
        ⚠️
      </div>
      <div class="flex-1">
        <h3 class="text-lg font-semibold text-gray-900 mb-1">Delete book?</h3>
        <p class="text-sm text-gray-500">
          You're about to delete <span id="delete-modal-title" class="font-medium text-gray-700"></span>.
          This action can't be undone.
        </p>
      </div>
    </div>

    <form id="delete-form" method="post" action="">
      {% csrf_token %}
      <div class="mt-6 flex items-center justify-end gap-2">
        <button type="button" onclick="closeDeleteModal()"
                class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
          Cancel
        </button>
        <button type="submit"
                class="rounded-lg bg-rose-600 text-white px-4 py-2 text-sm font-medium hover:bg-rose-700 transition">
          Yes, delete
        </button>
      </div>
    </form>
  </div>
</div>

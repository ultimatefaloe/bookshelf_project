<form method="post" enctype="multipart/form-data"
      action="{% if book %}{% url 'shelf:edit_book' book.id %}{% else %}{% url 'shelf:add_book' %}{% endif %}"
      class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-5 max-w-3xl">

  {% csrf_token %}

  <div>
    <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
    <input type="text" id="title" name="title" required
           value="{{ book.title|default:'' }}"
           class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <div>
    <label for="author" class="block text-sm font-medium text-gray-700 mb-1">Author</label>
    <input type="text" id="author" name="author" required
           value="{{ book.author|default:'' }}"
           class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <div>
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
    <textarea id="description" name="description" rows="4"
              class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">{{ book.description|default:'' }}</textarea>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <div>
      <label for="isbn_number" class="block text-sm font-medium text-gray-700 mb-1">ISBN Number</label>
      <input type="text" id="isbn_number" name="isbn_number"
             value="{{ book.isbn_number|default:'' }}"
             class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>

    <div>
      <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
      <select id="status" name="status"
              class="w-full rounded-lg border border-gray-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Select status</option>
        {% for value, label in statuses %}
          <option value="{{ value }}" {% if book and book.status == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div>
    <label for="cover" class="block text-sm font-medium text-gray-700 mb-1">Cover image (optional)</label>
    <input type="file" id="cover" name="cover" accept="image/*"
           class="block w-full text-sm text-gray-600 file:mr-3 file:rounded-lg file:border-0 file:bg-gray-900 file:text-white file:px-4 file:py-2 file:text-sm file:font-medium hover:file:bg-gray-700">
  </div>

  <div class="flex items-center justify-end gap-2 pt-2">
    <a href="{% url 'shelf:books' %}"
       class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
      Cancel
    </a>
    <button type="submit"
            class="rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-700 transition">
      {% if book %}Save changes{% else %}Add book{% endif %}
    </button>
  </div>
</form>
